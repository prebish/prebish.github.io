<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Joel Prebish – Software Engineer at PNC Bank. Explore my projects, work history, and background.">
    <meta name="theme-color" content="#0d0d0f">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://prebish.github.io/">
    <meta property="og:title" content="Joel Prebish – Software Engineer">
    <meta property="og:description" content="Software Engineer at PNC Bank. Explore my projects, work history, and background.">
    <!-- TODO: og:image — add a 1200x630 preview image and reference it here -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Joel Prebish – Software Engineer">
    <meta name="twitter:description" content="Software Engineer at PNC Bank. Explore my projects, work history, and background.">

    <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Joel Prebish</title>
    <link rel="stylesheet" href="static/style.css">
</head>


<body>
    <header>
        <div class="header-container">
            <div class="header-brand">
                <h1 class="brand-name">Joel Prebish</h1>
                <span class="brand-tagline">Software Engineer | Developer</span>
            </div>
            <nav class="header-nav">
                <a href="#bio" class="nav-link active">Featured</a>
                <a href="#projects" class="nav-link">Projects</a>
                <a href="#timeline" class="nav-link">Timeline</a>
                <a href="#cv" class="nav-link">CV</a>
            </nav>
        </div>
    </header>
    <div id="business-card" aria-label="Business card"></div>

    <div class="card-separator"></div>

    <section id="bio" class="bio-section">
        <div class="featured-grid"></div>
    </section>

    <section id="timeline" class="bio-section">
        <template id="milestone-template">
            <div class="timeline-item">
                <div class="timeline-icon"><i></i></div>
                <div class="timeline-content">
                    <span class="timeline-date"></span>
                    <h3 class="timeline-title"></h3>
                    <span class="timeline-org"></span>
                    <p class="timeline-description"></p>
                    <p class="timeline-details"></p>
                </div>
            </div>
        </template>
        <h2 class="section-title"><span>Timeline</span></h2>
        <div class="timeline"></div>
    </section>
    <section id="projects" class="bio-section">
        <!-- Template for project cards -->
        <template id="project-template">
            <div class="project-card">
                <div class="project-header">
                    <i class="fas fa-code-branch project-icon"></i>
                    <h3 class="project-name"></h3>
                    <span class="project-stars"><i class="fas fa-star"></i> <span class="stars-count"></span></span>
                    <span class="project-lock"><i class="fas fa-lock"></i></span>
                </div>
                <p class="project-description"></p>
                <div class="project-topics"></div>
                <div class="project-meta">
                    <span class="project-language"><span class="lang-dot"></span><span class="lang-name"></span></span>
                    <span class="project-forks"><i class="fas fa-code-branch"></i> <span class="forks-count"></span></span>
                </div>
            </div>
        </template>
        <div class="projects-controls">
            <div class="projects-search">
                <i class="fas fa-search projects-search-icon"></i>
                <input type="text" class="projects-search-input" placeholder="Search projects…" autocomplete="off" spellcheck="false">
            </div>
            <div class="projects-controls-row">
                <div class="projects-sort">
                    <span class="controls-label"><i class="fas fa-sort-amount-down"></i> Sort</span>
                    <button class="sort-btn active" data-sort="date">Date</button>
                    <button class="sort-btn" data-sort="stars">Stars</button>
                    <button class="sort-btn" data-sort="size">Size</button>
                </div>
                <div class="controls-sep"></div>
                <div class="projects-tags">
                    <span class="controls-label"><i class="fas fa-tag"></i> Filter</span>
                    <div class="tags-list"></div>
                </div>
            </div>
        </div>
        <div class="projects-grid"></div>
    </section>

    <section id="cv" class="bio-section">
        <div class="cv-page-bar">
            <a class="cv-download-btn" href="Joel_Prebish_Resume_public.pdf" download><i class="fas fa-download"></i> Download PDF</a>
        </div>
        <div class="cv-pdf-viewer">
            <iframe src="Joel_Prebish_Resume_public.pdf" class="cv-pdf-iframe" title="Joel Prebish Resume"></iframe>
        </div>
        <!-- Shown instead of the iframe on small screens, where embedded PDFs don't render -->
        <div class="cv-mobile-card">
            <i class="fas fa-file-pdf cv-mobile-icon"></i>
            <h3 class="cv-mobile-title">Resume</h3>
            <p class="cv-mobile-note">The inline preview isn't available on small screens — view or download the PDF instead.</p>
            <div class="cv-mobile-actions">
                <a class="cv-download-btn" href="Joel_Prebish_Resume_public.pdf" target="_blank" rel="noopener"><i class="fas fa-eye"></i> View PDF</a>
                <a class="cv-download-btn cv-btn-outline" href="Joel_Prebish_Resume_public.pdf" download><i class="fas fa-download"></i> Download</a>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-label">© 2026 Joel Prebish · Pittsburgh, PA</span>
            <a class="footer-cta" href="mailto:prebish.j@outlook.com"><i class="fas fa-envelope"></i> Get in Touch</a>
        </div>
    </footer>

    <script src="static/style.js"></script>
</body>

</html>
