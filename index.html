<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Joel Prebish – Software Engineer at PNC Bank. Explore my projects, work history, and background.">
    <meta name="theme-color" content="#0d0d0f">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://prebish.github.io/">
    <meta property="og:title" content="Joel Prebish – Software Engineer">
    <meta property="og:description" content="Software Engineer at PNC Bank. Explore my projects, work history, and background.">
    <!-- TODO: og:image — add a 1200x630 preview image and reference it here -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Joel Prebish – Software Engineer">
    <meta name="twitter:description" content="Software Engineer at PNC Bank. Explore my projects, work history, and background.">

    <!-- Runs before any stylesheet: restores the saved theme (no flash) and decides whether the
         first-visit intro overlay shows (never under reduced motion, once per session). -->
    <script>(function(){try{var d=document.documentElement;
var t=localStorage.getItem('theme');if(t==='crt'||t==='wallst')d.setAttribute('data-theme',t);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!sessionStorage.getItem('intro-seen'))d.classList.add('show-loader');
}catch(e){}})();</script>
    <style>html{background:#0d0d0f}html[data-theme=crt]{background:#050403}html[data-theme=wallst]{background:#000}html.show-loader .intro{position:fixed;inset:0;z-index:20000;background:inherit}</style>

    <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Joel Prebish</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/crt.css">
    <link rel="stylesheet" href="static/wallst.css">
</head>


<body>
    <!-- First-visit intro: draws the JP mark, then lifts. Only rendered when <html> has .show-loader. -->
    <div class="intro" id="intro" aria-hidden="true">
        <svg class="intro-mark" viewBox="0 0 64 64" width="72" height="72">
            <rect class="intro-frame" x="2" y="2" width="60" height="60" rx="11" pathLength="1"/>
            <text class="intro-text" x="32" y="43" text-anchor="middle">JP</text>
        </svg>
    </div>

    <!-- The page's only header is this ticker ribbon (skills; a quote board in the Wall Street style).
         It carries no name and no navigation: the business card is the hero and the dock is the nav. -->
    <div class="ticker" aria-label="Technologies" hidden>
        <div class="ticker-viewport"><div class="ticker-track"></div></div>
    </div>

    <!-- The two buttons after the divider are utilities (style cycle, fridge mode), not destinations. -->
    <nav class="dock" aria-label="Primary">
        <a href="#bio" class="nav-link dock-item active" data-magnetic><i class="fas fa-house"></i><span>Home</span></a>
        <a href="#projects" class="nav-link dock-item" data-magnetic><i class="fas fa-layer-group"></i><span>Projects</span></a>
        <a href="#timeline" class="nav-link dock-item" data-magnetic><i class="fas fa-timeline"></i><span>Timeline</span></a>
        <a href="#cv" class="nav-link dock-item" data-magnetic><i class="fas fa-file-lines"></i><span>CV</span></a>
        <span class="dock-divider" aria-hidden="true"></span>
        <button type="button" class="dock-item dock-toggle" id="theme-toggle" aria-label="Style: default. Switch to terminal" title="Style: default · click for terminal" data-magnetic><i class="fas fa-palette" aria-hidden="true"></i></button>
        <button type="button" class="dock-item dock-toggle" id="fridge-toggle" aria-pressed="false" aria-label="Fridge mode" title="Fridge mode: drag things around; everyone sees where you left them" data-magnetic><i class="fas fa-magnet" aria-hidden="true"></i></button>
    </nav>

    <!-- "Doors": invisible wrappers (display: contents) until fridge mode turns the current tab's
         door into a positioned surface whose children become draggable magnets. The home door
         wraps the hero; the other tabs have a door inside their section. -->
    <div class="door" id="fridge-door">
        <div id="business-card" aria-label="Business card"></div>
        <div class="card-separator"></div>
    </div>

    <section id="bio" class="bio-section">
        <div class="featured-grid"></div>
    </section>

    <section id="timeline" class="bio-section">
        <template id="milestone-template">
            <div class="timeline-item">
                <div class="timeline-icon"><i></i></div>
                <div class="timeline-content">
                    <div class="timeline-meta">
                        <span class="timeline-eyebrow"></span>
                        <span class="timeline-badge-current">Current</span>
                    </div>
                    <span class="timeline-date"></span>
                    <h3 class="timeline-title" data-split></h3>
                    <span class="timeline-org"></span>
                    <p class="timeline-description"></p>
                    <p class="timeline-details"></p>
                    <div class="timeline-tags"></div>
                </div>
            </div>
        </template>
        <div class="door">
            <h2 class="section-title"><span data-split>Timeline</span></h2>
            <div class="timeline"></div>
        </div>
    </section>
    <section id="projects" class="bio-section">
        <!-- Template for a spotlighted project card -->
        <template id="spotlight-template">
            <article class="spotlight-card">
                <div class="spotlight-top">
                    <i class="spotlight-icon"></i>
                    <span class="spotlight-status"></span>
                </div>
                <h3 class="spotlight-name" data-split></h3>
                <p class="spotlight-blurb"></p>
                <p class="spotlight-highlight"><i class="fas fa-arrow-trend-up"></i> <span class="spotlight-highlight-text"></span></p>
                <div class="spotlight-tech"></div>
                <div class="spotlight-links"></div>
            </article>
        </template>

        <div class="door">
        <h2 class="section-title"><span data-split>Projects</span></h2>
        <p class="projects-intro"></p>

        <div class="spotlight-grid"></div>

        <aside class="projects-more">
            <div class="projects-more-head">
                <h3 class="projects-more-title">More on GitHub</h3>
                <a class="projects-more-cta" href="https://github.com/prebish" target="_blank" rel="noopener noreferrer">View profile <i class="fas fa-arrow-up-right-from-square"></i></a>
            </div>
            <p class="projects-more-note"></p>
            <div class="projects-more-list"></div>
        </aside>
        </div>
    </section>

    <section id="cv" class="bio-section">
        <div class="door">
        <div class="cv-page-bar">
            <a class="cv-download-btn" href="Joel_Prebish_Resume_public.pdf" download><i class="fas fa-download"></i> Download PDF</a>
        </div>
        <div class="cv-pdf-viewer">
            <iframe src="Joel_Prebish_Resume_public.pdf" class="cv-pdf-iframe cursor-native" title="Joel Prebish Resume"></iframe>
        </div>
        <!-- Shown instead of the iframe on small screens, where embedded PDFs don't render -->
        <div class="cv-mobile-card">
            <i class="fas fa-file-pdf cv-mobile-icon"></i>
            <h3 class="cv-mobile-title">Resume</h3>
            <p class="cv-mobile-note">The inline preview isn't available on small screens — view or download the PDF instead.</p>
            <div class="cv-mobile-actions">
                <a class="cv-download-btn" href="Joel_Prebish_Resume_public.pdf" target="_blank" rel="noopener"><i class="fas fa-eye"></i> View PDF</a>
                <a class="cv-download-btn cv-btn-outline" href="Joel_Prebish_Resume_public.pdf" download><i class="fas fa-download"></i> Download</a>
            </div>
        </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-label">© 2026 · Pittsburgh, PA</span>
        </div>
    </footer>

    <!-- Status toast (email copy, fridge saves). Hidden until something needs it. -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
        <span class="toast-text"></span>
        <button type="button" class="toast-btn">Copy</button>
    </div>

    <script src="static/style.js"></script>
    <script src="static/effects.js"></script>
    <script src="static/fridge.js"></script>
</body>

</html>
